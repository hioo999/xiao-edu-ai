[project]
name = "ai-creative-learning-workbench-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23,<26",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.30,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "socksio>=1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agentscope = ["agentscope>=2.0,<3"]
cos = ["cos-python-sdk-v5>=1.9,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
