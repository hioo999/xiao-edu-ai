<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffd9e8 0%, #fff5d6 50%, #d4f1f9 100%);
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 10px 20px;
  }
  h1 {
    color: #ff7eb9;
    font-size: 26px;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #fff;
    letter-spacing: 2px;
  }
  .score-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    width: 100%;
    max-width: 420px;
    justify-content: space-between;
  }
  .score-box {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    padding: 8px 10px;
    text-align: center;
    box-shadow: 0 3px 0 rgba(255,126,185,0.3);
    border: 2px solid #ffd1e3;
  }
  .score-box .label {
    font-size: 12px;
    color: #ff9ec4;
    margin-bottom: 2px;
  }
  .score-box .val {
    font-size: 22px;
    color: #ff5fa2;
    font-weight: bold;
  }
  .score-box.best .val { color: #f0a500; }
  .score-box.best { border-color: #ffe08a; box-shadow: 0 3px 0 rgba(240,165,0,0.3); }

  .canvas-wrap {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #f6fff8;
    border: 3px solid #b8e6c9;
    box-shadow: 0 6px 0 rgba(140,200,160,0.4);
  }
  canvas {
    display: block;
    touch-action: none;
  }

  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 420px;
  }
  .btn {
    flex: 1;
    min-width: 90px;
    padding: 12px 8px;
    font-size: 16px;
    font-family: inherit;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 1px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .btn-start { background: #8ed986; box-shadow: 0 4px 0 #6bbf63; }
  .btn-reset { background: #ffb3c1; box-shadow: 0 4px 0 #e88c9f; }
  .btn-ai    { background: #a3c9ff; box-shadow: 0 4px 0 #7da3e8; }
  .btn.active { background: #7da3e8; box-shadow: 0 4px 0 #5a82c4; }

  .tip {
    margin-top: 10px;
    color: #9b8a8a;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .title {
    font-size: 28px;
    color: #ff5fa2;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #fff;
  }
  .overlay .sub {
    font-size: 16px;
    color: #888;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>

  <div class="score-bar">
    <div class="score-box">
      <div class="label">当前得分</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="score-box best">
      <div class="label">最高分</div>
      <div class="val" id="best">0</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="ovTitle">准备好了吗？</div>
      <div class="sub" id="ovSub">点击「开始」按钮，用方向键或滑动屏幕来玩吧！</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart">开始</button>
    <button class="btn btn-reset" id="btnReset">重置</button>
    <button class="btn btn-ai" id="btnAI">AI 自动模式</button>
  </div>

  <div class="tip">
    键盘 ⬆️⬇️⬅️➡️ 或在屏幕上滑动控制方向<br>
    点击 AI 自动模式，让小蛇自己找食物吃～
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub   = document.getElementById('ovSub');
  const btnStart = document.getElementById('btnStart');
  const btnReset = document.getElementById('btnReset');
  const btnAI    = document.getElementById('btnAI');

  // ===== 网格设置 =====
  const GRID = 20;                 // 每格 20px
  let COLS = 20, ROWS = 20;        // 默认 20x20，移动端会调整

  // ===== 马卡龙配色 =====
  const COLORS = {
    bg: '#f6fff8',
    gridLine: '#eafaf0',
    snakeHead: '#ff9ec4',
    snakeBody: ['#ffb3c1','#ffd1dc','#a8e6cf','#b5e7f9','#c8b6ff','#ffe5a3'],
    food: '#ffd166',
    foodStroke: '#f0a500',
    eye: '#ffffff',
    pupil: '#333333'
  };

  // ===== 游戏状态 =====
  let snake, dir, nextDir, food, score, best, running, aiMode, timer;
  function readBestScore(){
    try { return parseInt(localStorage.getItem('snake_best') || '0', 10); }
    catch (error) { return 0; }
  }
  function saveBestScore(value){
    try { localStorage.setItem('snake_best', value); }
    catch (error) { /* 沙箱试玩模式下不保存最高分 */ }
  }
  best = readBestScore();
  bestEl.textContent = best;

  function fitCanvas(){
    // 根据屏幕宽度调整画布
    const maxW = Math.min(window.innerWidth - 30, 440);
    const cells = Math.max(12, Math.floor(maxW / GRID));
    COLS = ROWS = cells;
    canvas.width = cells * GRID;
    canvas.height = cells * GRID;
  }

  function init(){
    fitCanvas();
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    snake = [
      {x: cx, y: cy},
      {x: cx-1, y: cy},
      {x: cx-2, y: cy}
    ];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    running = false;
    draw();
    showOverlay('准备好了吗？', '点击「开始」按钮开始游戏～');
  }

  function placeFood(){
    let attempts = 0;
    while(attempts++ < 500){
      const fx = Math.floor(Math.random()*COLS);
      const fy = Math.floor(Math.random()*ROWS);
      if(!snake.some(s => s.x === fx && s.y === fy)){
        food = {x: fx, y: fy};
        return;
      }
    }
    food = {x:0, y:0};
  }

  function start(){
    if(running) return;
    hideOverlay();
    running = true;
    if(aiMode){
      btnAI.classList.add('active');
    }
    loop();
  }

  function loop(){
    if(!running) return;
    update();
    draw();
    const speed = Math.max(90, 220 - Math.floor(score/3)*10);
    timer = setTimeout(loop, speed);
  }

  function update(){
    if(aiMode){
      const aiDir = computeAI();
      if(aiDir) nextDir = aiDir;
    }

    // 防止反向
    if(nextDir.x !== -dir.x || nextDir.y !== -dir.y){
      dir = nextDir;
    }

    const head = snake[0];
    const newHead = {x: head.x + dir.x, y: head.y + dir.y};

    // 撞墙
    if(newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS){
      return gameOver('哎呀，撞墙啦！');
    }
    // 撞自己
    if(snake.some(s => s.x === newHead.x && s.y === newHead.y)){
      return gameOver('哎呀，撞到自己啦！');
    }

    snake.unshift(newHead);

    // 吃食物
    if(newHead.x === food.x && newHead.y === food.y){
      score++;
      scoreEl.textContent = score;
      if(score > best){
        best = score;
        bestEl.textContent = best;
        saveBestScore(best);
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  // ===== 简易 AI：贪心 + 避障 =====
  function computeAI(){
    const head = snake[0];
    // 候选方向（不反向）
    const dirs = [
      {x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}
    ].filter(d => !(d.x === -dir.x && d.y === -dir.y));

    let bestDir = null;
    let bestScore = -Infinity;

    for(const d of dirs){
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      // 撞墙或撞自己 -> 跳过
      if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if(snake.some(s => s.x === nx && s.y === ny)) continue;

      // 评分：越靠近食物分越高
      const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
      let s = 1000 - dist * 10;

      // 加一点随机扰动避免卡死
      s += Math.random() * 0.5;

      if(s > bestScore){
        bestScore = s;
        bestDir = d;
      }
    }
    return bestDir;
  }

  function gameOver(msg){
    running = false;
    clearTimeout(timer);
    btnAI.classList.remove('active');
    aiMode = false;
    draw();
    showOverlay('游戏结束', msg + ' 得分：' + score + '　点击「开始」再来一局～');
  }

  function reset(){
    running = false;
    clearTimeout(timer);
    aiMode = false;
    btnAI.classList.remove('active');
    init();
  }

  // ===== 绘制 =====
  function draw(){
    // 背景
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = COLORS.gridLine;
    ctx.lineWidth = 1;
    for(let i=0; i<=COLS; i++){
      ctx.beginPath();
      ctx.moveTo(i*GRID, 0);
      ctx.lineTo(i*GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i*GRID);
      ctx.lineTo(canvas.width, i*GRID);
      ctx.stroke();
    }

    // 食物（小苹果）
    drawFood(food.x, food.y);

    // 蛇
    for(let i = snake.length - 1; i >= 0; i--){
      const seg = snake[i];
      if(i === 0){
        drawSnakeHead(seg.x, seg.y, dir);
      } else {
        const color = COLORS.snakeBody[(i-1) % COLORS.snakeBody.length];
        drawSnakeBody(seg.x, seg.y, color);
      }
    }
  }

  function drawSnakeBody(gx, gy, color){
    const x = gx*GRID, y = gy*GRID;
    ctx.fillStyle = color;
    roundRect(x+2, y+2, GRID-4, GRID-4, 6);
    ctx.fill();
  }

  function drawSnakeHead(gx, gy, d){
    const x = gx*GRID, y = gy*GRID;
    ctx.fillStyle = COLORS.snakeHead;
    roundRect(x+1, y+1, GRID-2, GRID-2, 7);
    ctx.fill();

    // 眼睛位置随方向变化
    let e1, e2;
    const cx = x + GRID/2, cy = y + GRID/2;
    if(d.x === 1){       // 向右
      e1 = {x: x+GRID*0.65, y: y+GRID*0.3};
      e2 = {x: x+GRID*0.65, y: y+GRID*0.7};
    } else if(d.x === -1){ // 向左
      e1 = {x: x+GRID*0.35, y: y+GRID*0.3};
      e2 = {x: x+GRID*0.35, y: y+GRID*0.7};
    } else if(d.y === 1){  // 向下
      e1 = {x: x+GRID*0.3, y: y+GRID*0.65};
      e2 = {x: x+GRID*0.7, y: y+GRID*0.65};
    } else {               // 向上
      e1 = {x: x+GRID*0.3, y: y+GRID*0.35};
      e2 = {x: x+GRID*0.7, y: y+GRID*0.35};
    }

    ctx.fillStyle = COLORS.eye;
    ctx.beginPath();
    ctx.arc(e1.x, e1.y, 3, 0, Math.PI*2);
    ctx.arc(e2.x, e2.y, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = COLORS.pupil;
    ctx.beginPath();
    ctx.arc(e1.x, e1.y, 1.5, 0, Math.PI*2);
    ctx.arc(e2.x, e2.y, 1.5, 0, Math.PI*2);
    ctx.fill();
  }

  function drawFood(gx, gy){
    const x = gx*GRID, y = gy*GRID;
    const cx = x + GRID/2, cy = y + GRID/2;
    const r = GRID/2 - 3;

    // 苹果身体
    ctx.fillStyle = COLORS.food;
    ctx.strokeStyle = COLORS.foodStroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy+1, r, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // 叶子
    ctx.fillStyle = '#a8e6cf';
    ctx.beginPath();
    ctx.ellipse(cx + 3, y + 4, 3, 5, Math.PI/4, 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function showOverlay(title, sub){
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    overlay.classList.add('show');
  }
  function hideOverlay(){
    overlay.classList.remove('show');
  }

  // ===== 输入：键盘 =====
  document.addEventListener('keydown', function(e){
    const k = e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
    if(k === 'ArrowUp')    setDir(0,-1);
    else if(k === 'ArrowDown')  setDir(0,1);
    else if(k === 'ArrowLeft')  setDir(-1,0);
    else if(k === 'ArrowRight') setDir(1,0);
    else if(k === ' '){ if(!running) start(); }
  }, {passive: false});

  function setDir(x,y){
    if(aiMode) return;
    // 不允许直接反向
    if(x === -dir.x && y === -dir.y) return;
    nextDir = {x, y};
  }

  // ===== 输入：触屏滑动 =====
  let touchStart = null;
  canvas.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){
      touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
    }
  }, {passive: true});

  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
  }, {passive: false});

  canvas.addEventListener('touchend', function(e){
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if(Math.abs(dx) < 15 && Math.abs(dy) < 15){
      touchStart = null;
      return;
    }
    if(Math.abs(dx) > Math.abs(dy)){
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive: true});

  // ===== 按钮 =====
  btnStart.addEventListener('click', function(){
    if(!running) start();
  });
  btnReset.addEventListener('click', function(){
    reset();
  });
  btnAI.addEventListener('click', function(){
    aiMode = !aiMode;
    if(aiMode){
      btnAI.classList.add('active');
      btnAI.textContent = 'AI 已开启';
      if(!running) start();
    } else {
      btnAI.classList.remove('active');
      btnAI.textContent = 'AI 自动模式';
    }
  });

  // ===== 窗口变化 =====
  let resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      const wasRunning = running;
      const oldScore = score || 0;
      const oldSnake = snake ? snake.slice() : null;
      const oldFood = food;
      fitCanvas();
      // 简单处理：如果游戏在进行，重新初始化（避免越界）
      if(wasRunning || oldSnake){
        // 仅当尺寸变化较大时重置
        init();
      } else {
        init();
      }
    }, 200);
  });

  // 启动
  init();
})();
</script>
</body>
</html>
